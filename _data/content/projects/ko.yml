    - type: id_team
      project_name: "잔디로그"
      project_excerpt: "동아리 개발 습관 플랫폼 · 3명 · 웹 프론트엔드"
      img: ":jandi-og.png"
      img_title: "잔디로그"
      date: "2026-10-31"
      post: |
        # 잔디로그

        GitHub로 로그인해 팀에 들어가면, 매주 개인의 GitHub 잔디(인증일 3일 이상)와 기록글(1개 이상)을 기준으로 서버가 월요일 오전 7시에 통과와 미달을 판정하는 동아리 개발 습관 플랫폼입니다. 미달하면 경고가 쌓이고 3회면 벌칙 대상이 됩니다. 기록글을 쓴 날도 인증일로 인정해서, 인증하려고 쓴 글이 동아리 트러블슈팅 · 개발일지로 쌓이게 했습니다.

        서비스 주소: <https://glog-front.vercel.app>

        ![잔디로그 홈](:jandi-home.jpg)

        ### 개요

        | 항목 | 내용 |
        | ---- | ---- |
        | 기간 | 2026-09 ~ 진행 중 (2026-10-31 웹 배포) |
        | 인원 | 동아리 3명 |
        | 맡은 일 | 기획 문서 작업(약 40%), 웹 프론트엔드 전체, 배포 사이트 QA |
        | 웹 | React 19, TypeScript, Vite, React Router, Apollo Client, GraphQL Code Generator |
        | 서버 (팀원) | Spring Boot, Spring for GraphQL, PostgreSQL, MongoDB, Redis(Valkey), AWS |
        | 저장소 | [solmin6320/GLog-Front](https://github.com/solmin6320/GLog-Front) |

        ### 만든 것

        - GitHub OAuth 로그인, 가입 승인 없이 바로 사용
        - 팀 만들기 · 초대코드 · 아이디 초대 · 추방 · 팀장 넘기기 · 공개 설정 · 팀 현황판
        - 트러블슈팅(문제 · 원인 · 해결)과 개발일지(한 일 · 배운 점) 게시판, 태그 · 검색 · 댓글
        - 매일 오전 6시 잔디 수집, 월요일 오전 7시 지난 주 판정
        - 미달 시 경고 +1, 2주 연속 통과 시 -1, 3회면 벌칙 대상. 면제와 판정 정정은 관리자

        ![주간 활동](:jandi-weekly.jpg)

        ### 맡은 일

        웹 화면 22개를 맡았습니다. 백엔드가 아직 없을 때 GraphQL 스키마 파일 하나를 서버와의 약속으로 정하고, 가짜 서버(MSW)로 전 화면을 먼저 움직였습니다. 실제 서버가 나온 뒤에는 화면 코드는 그대로 두고 연결 부분만 바꿔 붙였습니다.

        서버가 주는 오류는 화면마다 따로 해석하지 않고 한 가지 형태로 바꾼 뒤, 화면 문구는 오류 코드로만 고르게 했습니다. 화면 테스트 약 700개를 두었고, PR마다 GitHub Actions에서 타입 검사 · lint · 테스트 · 빌드를 돌렸습니다.

        배포는 Vercel에 했습니다. 10/30 유스케이스 27개 점검, 11/1 배포 사이트에서 기능 흐름 16건과 디자인 일관성 14건을 고쳤고, 재점검에서 화면 25개와 모바일 12개 화면이 정상으로 확인됐습니다.

        ![프로필 1년 잔디](:jandi-profile.jpg)

        ### 개발 중 이슈

        배포 DB를 AWS RDS로 바꾸는 과정에서 소통이 어긋나, 문서는 MariaDB인데 서버는 10월 30일에 PostgreSQL로 먼저 바뀌었습니다. 팀 회의에서 PostgreSQL을 유지하기로 정하고 기능명세서와 DB명세서에 반영했습니다.

        프론트는 커밋되지 않은 로컬 백엔드 브랜치에 맞춰 연결했는데, 배포 서버는 원격 main 기준이라 스키마가 달랐습니다. 서버가 모르는 필드 하나 때문에 프로필 화면 쿼리 전체가 거절됐고, 배포 서버 스키마에 맞춰 고쳤습니다.

        서버와 화면의 오류 코드 이름이 달라서 중복 초대나 중복 면제 요청이 입력 오류로 안내됐습니다. 연결 부분에서 이름을 바꿔 읽어 맞는 문구가 나오게 했습니다.

        ### 느낀 점

        팀원끼리 같은 결정을 다르게 이해하면 문서와 실제 서버가 달라질 수 있다는 걸 겪었습니다. 중요한 결정은 회의에서 정하고 바로 문서에 날짜와 함께 남겨야 한다고 느꼈습니다.

        제 컴퓨터에서 잘 되는 것과 배포 서버에서 되는 것은 다르다는 걸 배웠습니다. 프론트를 연결하기 전에 어느 백엔드 브랜치가 실제로 배포되어 있는지부터 확인해야 한다고 느꼈습니다.

        서버와 화면이 오류 코드 이름을 다르게 쓰면 사용자에게 엉뚱한 안내가 나간다는 걸 QA로 알게 됐습니다. API 약속은 처음에 함께 맞추고, 배포 사이트를 직접 써 보며 찾은 문제를 목록으로 관리하는 방식이 도움이 됐습니다.

