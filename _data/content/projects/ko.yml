    - type: id_solo
      project_name: "들어갈까"
      project_excerpt: "가구가 방에 들어가는지 알려 주는 앱 · 1명"
      img: ":deulgalkka-screens.png"
      img_title: "들어갈까 화면"
      date: "2026-10-22"
      post: |
        # 들어갈까

        쇼핑몰 가구 치수만 넣으면 우리 집 방에 들어가는지 알려 주는 앱입니다. 방 크기를 넣고 가구 치수 박스를 평면도에 놓으면, 벽을 몇 cm 넘는지, 다른 가구와 몇 cm 겹치는지, 천장보다 높은지를 바로 알려 줍니다. 글로벌기술숙련진흥원 「AI활용 모바일 앱 풀스택 개발」 과정에서 기획부터 서버와 앱까지 혼자 만들었습니다.

        ![들어갈까 화면](:deulgalkka-screens.png)

        ### 개요

        | 항목 | 내용 |
        | ---- | ---- |
        | 기간 | 2026-10-20 ~ 2026-10-22 |
        | 인원 | 1명 (AI 코딩 도구 Claude Code 사용) |
        | 맡은 일 | 기획 · 명세서, Spring Boot 서버, Flutter 앱, 테스트 |
        | 기술 | Flutter, Dart, Riverpod, Spring Boot, Java, H2 |
        | 결과 | 1단계(MVP) 서버와 앱 완성, 서버 테스트 969개 · 앱 테스트 644개 통과 |
        | 저장소 | [hanbg191919-eng/APP-GO](https://github.com/hanbg191919-eng/APP-GO) |

        ### 만든 것

        - 이름 · 가로 · 세로 · 천장 높이(cm)로 방 만들기
        - 가구 치수 박스를 끌어서 옮기고 90°로 돌리기
        - 벽 넘침 · 방보다 큼 · 겹침 · 천장 초과를 cm 단위로 알려 주기
        - 이메일 가입과 인증, 로그인 유지, 네트워크가 끊겨도 편집 가능
        - 집 평면도, 다크 모드, 평면도 사진으로 방 모양 가져오기

        ### 맡은 일

        요구사항 · 기능 명세 · API · DB · 화면 명세를 먼저 쓰고, 문서끼리 어긋난 곳을 검토 회차로 기록하면서 개발했습니다. 정할 일은 근거와 권장안을 함께 남겼습니다(결정 기록 C-01~C-29).

        가구 배치를 판정하는 부분은 방과 가구 목록을 받아 네 가지 문제를 한 번에 계산합니다. 가구 중심이 홀수 mm면 가장자리가 0.5mm 단위가 되기 때문에, 좌표를 2배 한 정수로 계산해 소수 오차가 생기지 않게 했습니다.

        모든 길이는 mm 정수로 저장하고, 두 기기에서 같은 배치를 동시에 고치면 버전이 다를 때 저장을 막아 앞의 것을 덮어쓰지 않게 했습니다.

        ![ERD](:deulgalkka-erd.png)

        ### 개발 중 이슈

        혼자 한 프로젝트라 AI 도구가 판단을 대신하지 않게 하는 게 중요했습니다. 문서끼리 어긋나거나 새로 정할 것이 생기면 AI가 혼자 고치지 않고 권장안과 함께 저에게 묻게 했고, 결정은 제가 했습니다.

        PC 폴더 이름을 옮긴 뒤 Git에서 빠져 있던 자동 생성 파일이 옛 경로를 가리켜 사진 선택기가 열리지 않았습니다. `flutter pub get`으로 다시 만들고 앱을 재설치해서 해결했습니다.

        삼성 키보드가 adb 입력을 받지 않아 휴대폰 자동 조작이 안 됐습니다. 입력이 필요한 테스트는 에뮬레이터로, 손가락과 카메라 확인은 실제 휴대폰으로 나눠서 했습니다.

        ### 느낀 점

        AI 도구가 빠르게 코드를 써 줘도, 무엇을 왜 정했는지는 제가 알고 있어야 한다고 느꼈습니다. 결정을 직접 내리고 기록으로 남겨 두니 나중에 다시 보고 설명할 수 있었습니다.

        Git에 올리지 않는 자동 생성 파일도 PC 경로에 묶여 있을 수 있다는 걸 처음 알았습니다. 원인을 찾는 데 시간이 걸린 만큼, 해결 방법을 문서로 남겨 두는 게 중요하다고 느꼈습니다.

        두 기기에서 같은 배치를 고치는 상황이나 0.5mm 같은 작은 오차는 처음 설계할 때 생각하지 못한 부분이었습니다. 실제로 쓰는 상황을 떠올려 봐야 이런 문제가 보인다는 걸 배웠습니다.
