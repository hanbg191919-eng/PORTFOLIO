    - type: id_team
      project_name: "Young Trip"
      project_excerpt: "티맥스 IT희망학교 팀 프로젝트 · 2명 · 메인 책임"
      img: ":youngtrip-screens.png"
      img_title: "Young Trip 화면"
      date: "2026-10-29"
      post: |
        # Young Trip

        2~6명이 함께 국내 여행을 준비하면 단톡방에 가고 싶은 곳이 쏟아지는데, 그걸 일정표로 옮기는 일은 결국 한 사람이 떠안게 됩니다. Young Trip은 채팅에 나온 장소 이름을 찾아 후보에 담고, 하루에 다 못 가는 곳은 이유와 함께 빼고, 남은 곳을 방문 순서와 시간표, 지도 루트로 바꿔 주는 여행 계획 앱입니다. 티맥스 IT희망학교 팀 프로젝트입니다.

        ![Young Trip 화면](:youngtrip-screens.png)

        ### 개요

        | 항목 | 내용 |
        | ---- | ---- |
        | 기간 | 2026-09-19 ~ 진행 중 (2026-10-29 안드로이드 APK 1.0.0) |
        | 인원 | 2명 (디자인 · 발표 1명, 개발 1명) |
        | 맡은 일 | 메인 책임(전체 진행 · 최종 결정), 앱 · 서버 개발 대부분(커밋 기준 약 90%) |
        | 기술 | React Native, TypeScript, Expo, Node.js, PostgreSQL 17 |
        | 결과 | 기능 38개 중 34개 구현 · 4개 부분 구현, 자동 테스트 1,452개, 채팅 속 장소 인식 47개 중 45개 |
        | 저장소 | [2026-tmax-it-school/TMAXyoungkk](https://github.com/2026-tmax-it-school/TMAXyoungkk) |

        ### 만든 것

        - 로그인 없이 게스트로 바로 시작, 초대 링크로 최대 6명 합류
        - 채팅에 나온 장소를 찾아 후보에 담기
        - 확정 버튼 없이 자동 선별: 하루에 갈 수 있는 만큼만 남기고, 뺀 곳은 이유와 함께 보여 주고 되돌릴 수 있게
        - 날짜별 시간표와 지도 루트, 도보 · 자동차 이동 시간
        - 루트 재계산은 3초 이내, 재계산 1회당 경로 API 100회 이하, 같은 구간은 24시간 캐시
        - 위치 권한을 거부해도 계획 세우기와 일정 보기는 모두 가능

        ### 맡은 일

        하루 일정의 방문 순서를 정하는 부분을 만들었습니다. 하루 10곳 이하는 Held-Karp 동적계획법으로 가장 짧은 순서를 구하고, 11곳부터는 가까운 곳부터 잇고 2-opt로 다듬는 방식으로 바꿨습니다.

        이 밖에 날짜 배분과 시간표 생성, 지도의 순번 핀과 날짜별 루트 선, GPS 도착 감지와 늦어졌을 때 뒤 일정 조정안, 길찾기, 서버와 DB, 로그인을 맡았습니다. 마지막에는 안드로이드 APK로 빌드해 실제 휴대폰에 설치해 확인했습니다.

        여러 기기가 같은 여행방을 동시에 고쳐도 꼬이지 않도록, 일어난 일을 `trip_ops`에 이벤트 로그로 쌓고 받은 순서대로 한 번씩만 반영하게 했습니다. 위치 기록은 개인정보라 서버에 두지 않았습니다.

        ![ERD](:youngtrip-erd.png)

        ### 개발 중 이슈

        둘이서 기능이 많은 앱을 만들다 보니 누가 어디까지 맡는지 흐려지기 쉬웠습니다. 역할분담 문서에 각자 맡을 부분과 DB 테이블, 서로 넘겨줄 것을 표로 정하고, 의견이 갈리면 메인 책임인 제가 정한다는 규칙을 먼저 합의했습니다.

        기능 브랜치에서 오래 작업하다 develop을 합치면 같은 파일이 양쪽에서 바뀌어 충돌이 났습니다. 큰 병합 전에는 백업 브랜치를 먼저 만들고, develop을 제 브랜치로 먼저 합쳐 충돌을 해결한 뒤 PR을 올렸습니다.

        카카오가 '경로 없음'을 주면 그대로 확정해서 자동차 일정이 도보 시간으로 계산되는 문제를 직접 테스트하다 찾았습니다. 경로가 없으면 다른 제공자(OSRM)에게 한 번 더 묻도록 고쳤습니다. 실제 기기에서 키보드가 입력칸을 가리던 문제, 서버 주소를 바꾼 뒤 첫 로그인이 실패하던 문제도 휴대폰으로 확인하며 고쳤습니다.

        ### 느낀 점

        역할을 나눌 때 맡을 기능만 정하면 경계가 흐려진다는 걸 알게 됐습니다. 서로 무엇을 넘겨줄지, 의견이 갈리면 누가 정할지까지 미리 적어 두는 게 협업에서 중요하다고 느꼈습니다.

        기능 브랜치를 오래 끌수록 합칠 때 충돌이 커졌습니다. 다음에는 develop을 자주 받아 오고, 큰 병합 전에는 백업 브랜치를 만들어 두려고 합니다.

        경로 API 호출 상한과 캐시를 처음부터 요구사항에 넣어 두니 알고리즘을 고를 기준이 생겼습니다. 반대로 키보드 문제나 '경로 없음' 응답, 로그인 실패는 테스트 통과만으로는 보이지 않았고, 실제 휴대폰에서 써 봐야 찾을 수 있었습니다.

